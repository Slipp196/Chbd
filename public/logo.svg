<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="chbd-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#805af5" />
      <stop offset="100%" stop-color="#6941eb" />
    </linearGradient>
    <linearGradient id="chbd-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Purple squircle base -->
  <rect x="2" y="2" width="124" height="124" rx="34" ry="34" fill="url(#chbd-bg)" />
  
  <!-- Subtle top inner highlight -->
  <rect x="2" y="2" width="124" height="124" rx="34" ry="34" fill="none" stroke="url(#chbd-glow)" stroke-width="2" />

  <!-- Outlined Play Triangle with rounded corners -->
  <path
    d="M 34 43 C 34 40.5 36.8 38.8 39.2 40.2 L 67.8 62.4 C 69.8 63.9 69.8 67 67.8 68.5 L 39.2 90.7 C 36.8 92.1 34 90.4 34 87.9 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Three dots trailing the tip -->
  <circle cx="79.5" cy="65.5" r="4.5" fill="#ffffff" />
  <circle cx="91.5" cy="65.5" r="4.5" fill="#ffffff" />
  <circle cx="103.5" cy="65.5" r="4.5" fill="#ffffff" />
</svg>
